# netlify.toml

[build]
  base = "KOii-chat-react-app"
  publish = "dist"
  command = "npm run build"

# Simple CORS configuration to allow only koiib.com
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://www.koiib.com"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
    
# Redirect all requests to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The Edge Function in netlify/edge-functions/cors-handler.ts 
# will now handle CORS for /assets/*

[[headers]]
  # If you have other assets like fonts not in /assets/, you might need rules for them too
  # Example for fonts if they are in a different path:
  # for = "/fonts/*"
  # [headers.values]
  #   Access-Control-Allow-Origin = "https://www.koiib.com" 